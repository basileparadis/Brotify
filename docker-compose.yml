version: "3.9"
services:

  db:
    image: "postgres:14.1"
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brotify-db
    healthcheck:
      test: pg_isready -U $POSTGRES_USER db
      interval: 30s
      timeout: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: "redis:alpine"
    command: redis-server --requirepass pRoSiciTuSTA
    environment:
     - REDIS_REPLICATION_MODE=master
     - C_FORCE_ROOT=true

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - C_FORCE_ROOT=true
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
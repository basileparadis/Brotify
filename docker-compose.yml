version: "3.2"
services:

  redis:
    image: "redis:alpine"

    command: redis-server --requirepass pRoSiciTuSTA

    ports:
      - "6379:6379"

    environment:
     - REDIS_REPLICATION_MODE=master

  app:
    build: .
    environment:
      - REDIS_HOST=redis
      - C_FORCE_ROOT=true
    ports:
      - "80:8000"

version: "3.9"
services:

  db:
    image: postgres
    env_file: ./.env
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U $POSTGRES_USER
      interval: 30s
      timeout: 30s

  redis:
    image: "redis:alpine"
    command: redis-server --requirepass pRoSiciTuSTA
    environment:
     - REDIS_REPLICATION_MODE=master
     - C_FORCE_ROOT=true

  app:
    build: .
    command: python manage.py runserver 0.0.0.0:5000
    volumes:
      - .:/code
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - C_FORCE_ROOT=true
    depends_on:
      - db
      - redis
    entrypoint: ./entrypoint.sh
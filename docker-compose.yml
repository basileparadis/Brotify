services:
  brotify-db:
    image: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -h $POSTGRES_DB"]
      interval: 30s
      timeout: 30s

  redis:
      image: redis:latest
      restart: always
      command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD"
      environment:
        - C_FORCE_ROOT=true
        - REDIS_PASSWORD=${REDIS_PASSWORD}
      ports:
        - "6379:6379"
      env_file:
        - .env

  nginx-static:
    image: nginx:latest
    volumes:
      - ./src:/src
      - ./config/nginx:/etc/nginx/conf.d
    depends_on:
      - app

  app:
    build: .
    command: python manage.py runserver 0.0.0.0:5000
    volumes:
      - .:/code
      - ./Brotify/static:/static:ro
      - ./local.ini:/code/local.ini
    ports:
      - "5000:5000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_NAME}
    depends_on:
      - brotify-db
      - redis
    entrypoint: ./entrypoint.sh
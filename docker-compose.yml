version: "3.9"
services:

  db:
    image: "postgres:14-alpine"
    env_file:
      - .env
    #environment:
      #- "POSTGRES_HOST_AUTH_METHOD=trust"
    healthcheck:
      test: pg_isready -U $POSTGRES_USER
      interval: 30s
      timeout: 30s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: "redis:alpine"
    command: redis-server --requirepass pRoSiciTuSTA
    #ports:
      #- "6379:6379"
    environment:
     - REDIS_REPLICATION_MODE=master
     - C_FORCE_ROOT=true

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - C_FORCE_ROOT=true
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
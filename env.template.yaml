APP:
  DEBUG: "true"
  LOG_LEVEL: "DEBUG"
  LOG_MAIN_FILE: "./brotify.log"
  SECRET_KEY: "your_secret_key"
  USE_HTTPS: "false"
  WORKER_DEFAULT_PASSWORD_SALT: "worker_default_password_salt_placeholder"
  SUPPORT_EMAIL_ADDRESS: "your_email@example.com"
  DJANGO_SU_NAME: "your_name"
  DJANGO_SU_EMAIL: "your_email@example.com"
  BASE_URL: "your_base_url"
  SESSION_COOKIE_SECURE: "false"
  CSRF_COOKIE_SECURE: "false"
  SECURE_SSL_REDIRECT: "false"
  SOCIAL_AUTH_REDIRECT_IS_HTTPS: "false"
  IS_LOCAL: "true"

DATABASE:
  ENGINE: "database_engine_placeholder"
  NAME: "database_name_placeholder"
  PASSWORD: "your_db_password"
  USER: "your_db_user"
  HOST: "database_host_placeholder"
  PORT: "database_port_placeholder"
  CONNECTION_MAX_AGE: "0"

REDIS:
  PASSWORD: "your_redis_password"

SMTP:
  BACKEND: "django.core.mail.backends.console.EmailBackend"
  HOST: "host_placeholder"
  PORT: "port_placeholder"
  TLS: "tls_placeholder"
  USER: "user_placeholder"
  PASSWORD: "password_placeholder"

AMQP:
  URL: "amqp://localhost:5672"
  QUEUE: "data_input"
  MESSAGING_QUEUE: "messaging_hub_v3"
  ALERTS_QUEUE: "alerts"
APP:
  DEBUG: "false"
  LOG_LEVEL: "DEBUG"
  LOG_MAIN_FILE: "./brotify.log"
  SECRET_KEY: "./run/secrets/APP_SECRET_KEY/key"
  USE_HTTPS: "false"
  WORKER_DEFAULT_PASSWORD_SALT: "./run/secrets/APP_WORKER_DEFAULT_PASSWORD_SALT/key"
  SUPPORT_EMAIL_ADDRESS: "support@brotify.ca"
  DJANGO_SU_NAME: "admin"
  DJANGO_SU_EMAIL: "admin@brotify.ca"
  BASE_URL: "brotify.ca"
  SESSION_COOKIE_SECURE: "false"
  CSRF_COOKIE_SECURE: "false"
  SECURE_SSL_REDIRECT: "false"
  SOCIAL_AUTH_REDIRECT_IS_HTTPS: "false"
  IS_LOCAL: "false"

DATABASE:
  ENGINE: "django.db.backends.postgresql"
  NAME: "brotify-db"
  PASSWORD: "./run/secrets/POSTGRES_PASSWORD/key"
  USER: "./run/secrets/POSTGRES_USER/key"
  HOST: "./run/secrets/POSTGRES_HOST/key"
  PORT: "5432"
  CONNECTION_MAX_AGE: "0"

REDIS:
  PASSWORD: "./run/secrets/REDIS_PASSWORD/key"

SMTP:
  BACKEND: "django.core.mail.backends.console.EmailBackend"
  HOST: "host_placeholder"
  PORT: "port_placeholder"
  TLS: "tls_placeholder"
  USER: "./run/secrets/SMTP_USER/key"
  PASSWORD: "./run/secrets/SMTP_PASSWORD/key"

AMQP:
  URL: "amqp://localhost:5672"
  QUEUE: "data_input"
  MESSAGING_QUEUE: "messaging_hub_v3"
  ALERTS_QUEUE: "alerts"
{% extends 'base.html' %}
{% load bulma_tags %}

{% block title %}S'inscrire sur Brotify{% endblock %}

{% block content %}
  <h2>Créer votre compte</h2>
  <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.username|bulma }}
      {{ form.prenom|bulma }}
      {{ form.nom|bulma }}
      {{ form.courriel|bulma }}
      {{ form.avatar|bulma }}

    <button type="submit" class="button is-primary">Créer mon compte</button>
  </form>
{% endblock %}

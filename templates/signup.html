{% extends 'base.html' %}
{% load bulma_tags %}

{% block content %}
<div class="container column is-half is-offset-one-quarter">
  <div class="box">
      <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form|bulma }}
        <button type="submit" class="button is-primary">Créer mon compte</button>
      </form>
  </div>
</div>
{% endblock %}
